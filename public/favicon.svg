<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0b1224" />
      <stop offset="100%" stopColor="#060a15" />
    </linearGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fef08a" />
      <stop offset="30%" stopColor="#eab308" />
      <stop offset="70%" stopColor="#ca8a04" />
      <stop offset="100%" stopColor="#a16207" />
    </linearGradient>

    <!-- Navy / Sapphire Gradient -->
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="50%" stopColor="#0284c7" />
      <stop offset="100%" stopColor="#0369a1" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.65" />

  <!-- Outer Golden Flight Orbital Arc -->
  <path d="M 230 110 C 340 100, 420 180, 420 280 C 420 340, 380 400, 310 430" fill="none" stroke="url(#goldGrad)" stroke-width="26" stroke-linecap="round" />

  <!-- Lower Golden Flight Trail -->
  <path d="M 120 440 C 220 455, 360 410, 440 310" fill="none" stroke="url(#goldGrad)" stroke-width="20" stroke-linecap="round" />

  <!-- Main Luxury 'M' Monogram in Bold Navy/Cyan -->
  <path d="M 120 130 L 175 130 L 235 340 L 295 130 L 350 130 L 350 380 L 305 380 L 305 210 L 255 380 L 215 380 L 165 210 L 165 380 L 120 380 Z" fill="#ffffff" />
  <path d="M 130 140 L 170 140 L 235 345 L 295 140 L 340 140 L 340 370 L 312 370 L 312 225 L 252 375 L 218 375 L 158 225 L 158 370 L 130 370 Z" fill="url(#navyGrad)" />

  <!-- Center-Right 3D Globe with Lat/Long -->
  <g transform="translate(355, 315)">
    <circle cx="0" cy="0" r="62" fill="#0b172a" stroke="url(#navyGrad)" stroke-width="5" />
    <circle cx="0" cy="0" r="60" fill="url(#navyGrad)" opacity="0.3" />
    <ellipse cx="0" cy="0" rx="32" ry="60" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.6" />
    <ellipse cx="0" cy="0" rx="60" ry="24" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.6" />
    <line x1="-60" y1="0" x2="60" y2="0" stroke="#38bdf8" stroke-width="3" opacity="0.6" />
    <line x1="0" y1="-60" x2="0" y2="60" stroke="#38bdf8" stroke-width="3" opacity="0.6" />
  </g>

  <!-- Flight Path swooping from globe towards top-right -->
  <path d="M 330 360 C 370 330, 420 280, 440 220" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-dasharray="10 8" stroke-linecap="round" />

  <!-- Golden Airplane Silhouette at Flight Apex -->
  <g transform="translate(445, 210) rotate(-42) scale(1.65)" filter="url(#goldGlow)">
    <path d="M 0 -22 L 7 -5 L 22 -1 L 22 5 L 7 3 L 5 18 L 11 22 L 11 26 L 0 24 L -11 26 L -11 22 L -5 18 L -7 3 L -22 5 L -22 -1 L -7 -5 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Top Accent Sparkle -->
  <path d="M 230 65 L 236 85 L 256 91 L 236 97 L 230 117 L 224 97 L 204 91 L 224 85 Z" fill="#fef08a" />
</svg>